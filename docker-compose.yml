services:
  backend:
    build:
      context: ./backend/Lumina
      dockerfile: Lumina/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Data Source=/app/data/lumina.db
      Cors__AllowedOrigins__0: http://localhost:8080
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      Ollama__Model: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      Ollama__TimeoutMinutes: ${OLLAMA_TIMEOUT_MINUTES:-5}
    volumes:
      - lumina-data:/app/data
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

  ollama:
    image: ollama/ollama:latest
    profiles:
      - ai
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  lumina-data:
  ollama-data:
