services:
  backend:
    build:
      context: ./backend/Lumina
      dockerfile: Lumina/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: ${ALLOWED_HOSTS:-localhost}
      ConnectionStrings__DefaultConnection: Data Source=/app/data/lumina.db
      Storage__LocalRootPath: /app/data/documents
      Rag__Telemetry__CaptureContent: "false"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Gemini__ApiKey: ${GEMINI_API_KEY:?Set GEMINI_API_KEY in .env}
      Gemini__BaseUrl: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com}
      Gemini__DefaultModel: ${GEMINI_DEFAULT_MODEL:-gemini-flash}
      Gemini__TimeoutMinutes: ${GEMINI_TIMEOUT_MINUTES:-5}
      Ollama__BaseUrl: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/}
      Ollama__EmbeddingModel: ${OLLAMA_EMBEDDING_MODEL:-embeddinggemma-2:270m}
      Qdrant__BaseUrl: ${QDRANT_BASE_URL:-http://qdrant:6333/}
      Qdrant__Collection: ${QDRANT_COLLECTION:-lumina_document_chunks}
    volumes:
      - lumina-data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  lumina-data:
  qdrant-data:
